<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <meta name="referrer" content="no-referrer">
    <title>Set a new password | TroyStack</title>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <script>
        // The app's reset email lands here when the TroyStack app isn't on this
        // device to catch it. Supabase puts the reset session in the fragment,
        // so the fragment (and any query) goes along to troystack.ai, where the
        // account's new password is set. Nothing here reads or keeps it.
        location.replace('https://troystack.ai/reset-password' + location.search + location.hash);
    </script>
    <style>
        :root {
            --bg-primary: #0A0A0E;
            --gold: #DAA520;
            --text-primary: #FFFFFF;
            --text-secondary: #9CA3AF;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
        }
        .container { max-width: 420px; margin: 0 auto; padding: 96px 24px; text-align: center; }
        h1 { font-size: 1.5rem; margin-bottom: 12px; }
        p { color: var(--text-secondary); margin-bottom: 24px; }
        .btn {
            display: inline-block;
            padding: 12px 20px;
            border-radius: 12px;
            background: var(--gold);
            color: #0A0A0E;
            font-weight: 600;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <main class="container">
        <h1>Set a new password</h1>
        <p>Taking you to troystack.ai to finish your reset.</p>
        <a class="btn" id="go" href="https://troystack.ai/reset-password">Set my new password</a>
    </main>
    <script>
        document.getElementById('go').href = 'https://troystack.ai/reset-password' + location.search + location.hash;
    </script>
</body>
</html>
